    <meta charset="UTF-8" />
    <script>
      // Immediately unregister foreign service workers (from other local projects on port 5173)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          var hadRegistration = registrations.length > 0;
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              for (var j = 0; j < keys.length; j++) {
                caches.delete(keys[j]);
              }
            });
          }
          if (hadRegistration && navigator.serviceWorker.controller && !sessionStorage.getItem('__sw_purged')) {
            sessionStorage.setItem('__sw_purged', '1');
            window.location.reload();
          }
        });
      }
    </script>
